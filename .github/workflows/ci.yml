name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: "test (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python ${{ matrix.python-version }}"
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

  lint:
    name: "lint: ruff + mypy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: "Ruff: check"
        run: ruff check .

      - name: "Mypy: strict"
        run: mypy

  smoke:
    name: "smoke: lint example migrations"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install .

      - name: "Smoke test: dangerous migrations exit non-zero"
        run: |
          if sql-migrate-lint examples/migrations/dangerous --dialect postgres; then
            echo "expected a non-zero exit code for the dangerous examples" >&2
            exit 1
          fi

      - name: "Smoke test: safe migrations exit zero"
        run: sql-migrate-lint examples/migrations/safe --dialect postgres

  build:
    name: "build: wheel"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

  pg-ground-truth:
    # Service-dependent: checks the linter's PostgreSQL facts (table rewrites,
    # lock modes) against a throwaway cluster created from the PostgreSQL
    # binaries preinstalled on the runner. Kept separate from portable tests.
    name: "PostgreSQL ground truth"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Run ground-truth tests against the runner's PostgreSQL
        run: |
          export SQL_MIGRATE_LINT_PG_BINDIR="$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)"
          echo "using $SQL_MIGRATE_LINT_PG_BINDIR"
          pytest -v -rs tests/test_pg_ground_truth.py
